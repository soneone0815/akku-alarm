name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle Wrapper erzeugen
        run: gradle wrapper --gradle-version 8.7

      - name: Ausführungsrechte setzen
        run: chmod +x ./gradlew

      - name: Android SDK Lizenzen akzeptieren
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Debug-APK bauen
        run: ./gradlew assembleDebug --stacktrace

      - name: APK als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
